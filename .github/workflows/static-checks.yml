name: Site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate site files
        run: python tools/validate_site.py
      - name: Check browser JavaScript syntax
        run: node --check script.js
      - name: Check server JavaScript syntax
        run: node --check server.js
